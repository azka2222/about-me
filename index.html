<meta name="color-scheme" content="dark">
<meta name="description" content="A quiet corner of the internet, after dark.">
<title>Rayan Fayad A. — after dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   Lakeside night — a calm, lightweight link-in-bio page.
   Mobile-first (360–430px); scales up to desktop.
   Colours live in :root so the whole mood can be retuned in one place.
   ===================================================================== */
:root{
  --bg:#03050f; --ink:#e9eefc; --mute:#a3afd2; --faint:#6c7aa3;
  --line:rgba(160,185,255,.16); --glass-a:rgba(18,26,56,.74); --glass-b:rgba(8,12,30,.8);
  --amber:#ffb86b; --moon:#dfe9ff;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{
  min-height:100vh;min-height:100svh;background:var(--bg);color:var(--ink);
  font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid rgba(190,210,255,.85);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- background layers ---------- */
.scene,.bg-photo,.veil{position:fixed;inset:0;pointer-events:none}
.scene{z-index:0}
.scene svg{display:block;width:100%;height:100%}
.bg-photo{z-index:1;background:center/cover no-repeat;opacity:0;transition:opacity 1.4s ease}
.has-photo .bg-photo{opacity:1}
.has-photo .scene{visibility:hidden}                 /* photo replaces the SVG scene (and stops its animations) */
.veil{z-index:2;
  background:
    radial-gradient(120% 62% at 50% 0%,rgba(3,5,15,.6),transparent 72%),
    linear-gradient(180deg,rgba(3,5,15,.3) 0,transparent 30%,transparent 74%,rgba(3,5,15,.42) 100%);
}

/* tiny, compositor-friendly motion inside the scene */
.tw{animation:tw 4.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.22}50%{opacity:1}}
.sh{transform-box:fill-box;transform-origin:center;animation:sh 4.6s ease-in-out infinite alternate}
@keyframes sh{from{transform:scaleX(.72);opacity:.45}to{transform:scaleX(1.14);opacity:1}}
.rip{animation:rip 12s ease-in-out infinite alternate}
@keyframes rip{to{transform:translateX(20px)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .85s ease-in-out infinite alternate}
@keyframes flame{from{transform:scale(.9,.94) skewX(-3deg)}to{transform:scale(1.07,1.1) skewX(3deg)}}
.glowf{animation:glowf 2.6s ease-in-out infinite alternate}
@keyframes glowf{from{opacity:.68}to{opacity:1}}
.spark{animation:spark 2.8s ease-out infinite}
@keyframes spark{0%{transform:translate(0,0);opacity:.9}100%{transform:translate(var(--x,6px),-36px);opacity:0}}
.ff{animation:ff var(--d,9s) ease-in-out infinite alternate}
@keyframes ff{0%{transform:translate(0,0);opacity:0}18%{opacity:.95}55%{opacity:.25}85%{opacity:.95}100%{transform:translate(var(--x,20px),var(--y,-16px));opacity:0}}

/* ---------- page ---------- */
.page{
  position:relative;z-index:3;width:100%;max-width:440px;margin:0 auto;
  padding:max(30px,env(safe-area-inset-top)) 20px calc(108px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.rise{opacity:0;animation:rise .9s var(--ease) forwards;animation-delay:calc(var(--i,0)*110ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.avatar{
  width:96px;height:96px;padding:3px;border-radius:50%;
  background:conic-gradient(from 210deg,rgba(200,218,255,.8),rgba(90,120,220,.14),rgba(200,218,255,.8));
  box-shadow:0 0 0 1px rgba(160,185,255,.18),0 14px 44px -12px rgba(90,120,230,.6);
}
.avatar img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid var(--bg);background:#0b1230}
.tag{margin-top:18px;font:400 .68rem/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}
h1{
  margin-top:12px;font:300 clamp(2rem,8.4vw,2.6rem)/1.08 var(--serif);letter-spacing:-.01em;
  text-shadow:0 2px 24px rgba(3,5,15,.9);
}
h1 em{font-style:italic;font-weight:300;color:#cfe0ff}
.bio{margin-top:14px;max-width:34ch;font-size:.97rem;line-height:1.62;color:var(--mute);text-shadow:0 1px 14px rgba(3,5,15,.95)}

/* ---------- links ---------- */
.links{list-style:none;padding:0;width:100%;display:grid;gap:12px;margin-top:28px}
.link{
  position:relative;display:flex;align-items:center;gap:14px;min-height:74px;padding:12px 16px 12px 14px;
  border-radius:18px;border:1px solid var(--line);text-decoration:none;text-align:left;
  background:linear-gradient(180deg,var(--glass-a),var(--glass-b));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 32px -20px #000;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;
}
.link:active{transform:scale(.985)}
@media (hover:hover){
  .link:hover{transform:translateY(-2px);border-color:rgba(190,210,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 20px 40px -20px rgba(70,100,220,.5)}
}
.ico{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(120,150,255,.07);color:#d6e2ff}
.ico svg{width:22px;height:22px}
.txt{flex:1;min-width:0;display:grid;gap:3px}
.idx{font:400 .6rem/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.label{font:400 1.3rem/1.1 var(--serif)}
.handle{font:400 .74rem/1.2 var(--mono);letter-spacing:.04em;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{flex:none;width:20px;height:20px;color:var(--faint);transition:transform .3s var(--ease),color .3s}
@media (hover:hover){.link:hover .go{transform:translate(2px,-2px);color:var(--ink)}}

.foot{margin-top:30px;font:400 .62rem/1.6 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);text-shadow:0 1px 10px #000}

/* ---------- crack overlay (drawn at the tap point, then slowly mends) ---------- */
.crack{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none}
.crack path{fill:none;stroke-linecap:butt;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:crackLife 1.9s linear forwards}
.crack .cg{stroke:rgba(150,185,255,.28);stroke-width:5}
.crack .cd{stroke:#01030a;stroke-width:2.6}
.crack .cl{stroke:#eef3ff;stroke-width:1.2}
@keyframes crackLife{
  0%{stroke-dashoffset:1;opacity:1;animation-timing-function:cubic-bezier(.15,.75,.2,1)}
  10%{stroke-dashoffset:0;opacity:1}
  22%{stroke-dashoffset:0;opacity:1;animation-timing-function:cubic-bezier(.45,0,.4,1)}
  100%{stroke-dashoffset:1;opacity:.15}
}
.crack .ring{fill:none;stroke:rgba(235,242,255,.9);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:ring .9s ease-out forwards}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(3.2);opacity:0}}

/* ---------- dock: music + birdsong ---------- */
.dock{
  position:fixed;z-index:20;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:10px;padding:0 16px;pointer-events:none;
}
.dock>*{pointer-events:auto}
.player{
  display:flex;align-items:center;gap:11px;height:54px;min-width:0;flex:0 1 330px;padding:0 16px 0 9px;
  border-radius:999px;border:1px solid var(--line);background:rgba(7,11,28,.86);text-align:left;
  box-shadow:0 14px 34px -14px #000,inset 0 1px 0 rgba(255,255,255,.06);
}
.vinyl{flex:none;width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle,#0b1230 0 12%,#e9eefc 13% 17%,#0b1230 18% 38%,#18224a 39% 40%,#080d22 41% 62%,#18224a 63% 64%,#070b1d 65%);
  box-shadow:0 0 0 1px rgba(160,185,255,.25)}
.player.is-playing .vinyl{animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.p-text{flex:1;min-width:0;display:grid;gap:3px}
.p-title{font:400 .7rem/1.1 var(--mono);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-status{font:400 .6rem/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.p-ico{flex:none;width:20px;height:20px;color:var(--moon)}
.p-ico svg{width:100%;height:100%;display:block}
.p-ico .ico-pause{display:none}
.player.is-playing .p-ico .ico-play{display:none}
.player.is-playing .p-ico .ico-pause{display:block}
.birds{
  flex:none;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;
  border:1px solid var(--line);background:rgba(7,11,28,.86);color:var(--moon);
  box-shadow:0 14px 34px -14px #000,inset 0 1px 0 rgba(255,255,255,.06);
}
.birds svg{width:24px;height:24px}
.birds .slash{display:none}
.birds.off{color:var(--faint)}
.birds.off .slash{display:block}
.player:hover,.birds:hover{border-color:rgba(190,210,255,.4)}

/* ---------- larger screens: profile on the left, the camp breathes on the right ---------- */
@media (min-width:900px){
  .page{margin:0 0 0 clamp(32px,9vw,170px);padding-top:max(52px,env(safe-area-inset-top))}
  .dock{justify-content:flex-start;padding-left:clamp(32px,9vw,170px)}
  .veil{background:
    linear-gradient(90deg,rgba(3,5,15,.55),transparent 48%),
    linear-gradient(180deg,rgba(3,5,15,.25) 0,transparent 30%,transparent 78%,rgba(3,5,15,.35) 100%)}
}
@media (max-height:700px){.foot{margin-top:96px}}      /* short phones: let the footer scroll below the camp instead of sitting on it */
@media (max-width:370px){
  .page{padding-left:16px;padding-right:16px}
  .label{font-size:1.2rem}
  .player{padding-right:12px}
}

@media (prefers-reduced-motion:reduce){
  .tw,.sh,.rip,.flame,.glowf,.spark,.ff,.player.is-playing .vinyl{animation:none!important}
  .rise{animation:none;opacity:1}
  .link,.go{transition:none}
}
</style>
</head>

<!-- ============================ BACKGROUND ============================

     If the photo fails to load nothing breaks: the SVG scene simply stays. -->

(() => {

const CUSTOMIZE = {

  audioSrc:        './Lord Huron - The Night We Met Lirik Terjemahan.mp3',   // REPLACE_AUDIO_SRC  e.g. './the-night-we-met.mp3'

/* ===================== END CUSTOMIZE ===================== */

const NAV_DELAY = 650;                          // ms to let the crack + glitch play before the link opens

const $ = (s, r = document) => r.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function normalizeUrl(u) {
  u = String(u || '').trim();
  if (!u) return '#';
  if (/^https?:\/\//i.test(u)) return u;
  return 'https://' + u.replace(/^[a-z][a-z0-9+.-]*:\/*/i, '').replace(/^\/+/, '');
}

/* ---------------------------------------------------------------------
   Content
   --------------------------------------------------------------------- */
function applyConfig() {

  nm.textContent = '';

    else nm.appendChild(document.createTextNode(part));
  });
  $('#tagline').textContent = C.tagline;
  $('#bio').textContent = C.bio;
  $('#foot-note').textContent = C.footerNote;
  $('#p-title').textContent = C.trackTitle + ' · ' + C.trackArtist;
  document.title = String(C.name).replace(/\*/g, '') + ' — ' + C.tagline;

  const ig = $('#link-ig'), tt = $('#link-tt');
  ig.href = normalizeUrl(C.instagramUrl); $('#ig-handle').textContent = C.instagramHandle;
  tt.href = normalizeUrl(C.tiktokUrl);    $('#tt-handle').textContent = C.tiktokHandle;

  // images: only swapped in once they have really loaded, so there is never a broken picture
  const preload = (url, ok) => { if (!url) return; const im = new Image(); im.decoding = 'async'; im.onload = () => ok(url); im.src = url; };
  preload(C.profileImage, (u) => { $('#profile-img').src = u; });
  preload(C.campingImage, (u) => {
    $('#bg-photo').style.backgroundImage = 'url("' + u.replace(/["\\\n]/g, '') + '")';
    document.body.classList.add('has-photo');

}

/* ---------------------------------------------------------------------
   Crack at the tap point → slowly mends
   Every branch is its own <path pathLength="1"> so all of them grow at once; CSS (crackLife) draws,
   holds, then retracts the dash back toward the impact point.
   --------------------------------------------------------------------- */
const SVGNS = 'http://www.w3.org/2000/svg';

function walk(x, y, a, len, out, depth) {
  const pts = [[x, y]];
  let d = 0, px = x, py = y;
  while (d < len) {
    const step = rand(8, 16);
    a += rand(-.34, .34) + (Math.random() < .12 ? rand(-.8, .8) : 0);
    px += Math.cos(a) * step; py += Math.sin(a) * step; d += step;
    pts.push([px, py]);
    if (depth < 1 && d > 22 && len - d > 34 && Math.random() < .26) {
      walk(px, py, a + (Math.random() < .5 ? -1 : 1) * rand(.5, 1.1), (len - d) * rand(.4, .65), out, depth + 1);
    }
  }
  out.push(pts);
}

function crackAt(x, y) {
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('class', 'crack');
  svg.setAttribute('viewBox', '0 0 ' + innerWidth + ' ' + innerHeight);
  svg.setAttribute('aria-hidden', 'true');
  const reach = clamp(Math.min(innerWidth, 520) / 360, .8, 1.5);
  const branches = [];
  const n = 7 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) walk(x, y, (i / n) * Math.PI * 2 + rand(-.3, .3), rand(70, 190) * reach, branches, 0);

  const mk = (cls, d) => {
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('class', cls); p.setAttribute('pathLength', '1'); p.setAttribute('d', d);
    return p;
  };
  branches.forEach((pts) => {
    const d = 'M' + pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
    svg.appendChild(mk('cg', d));
    const dark = mk('cd', d); dark.setAttribute('transform', 'translate(1 1.2)'); svg.appendChild(dark);   // a hairline of depth
    svg.appendChild(mk('cl', d));
  });
  const ring = document.createElementNS(SVGNS, 'circle');
  ring.setAttribute('class', 'ring'); ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.setAttribute('r', 9);
  svg.appendChild(ring);
  document.body.appendChild(svg);
  setTimeout(() => svg.remove(), 2100);

  if (!REDUCE) {                                       // a few shards jump off the impact
    for (let i = 0; i < 7; i++) {
      const s = document.createElementNS(SVGNS, 'path'), a = rand(0, 6.283), r = rand(3, 7);
      s.setAttribute('d', 'M0 ' + -r + ' L' + r * .7 + ' ' + r * .6 + ' L' + -r * .7 + ' ' + r * .5 + 'Z');
      s.setAttribute('fill', 'rgba(220,232,255,.85)'); s.setAttribute('stroke', 'none');
      s.setAttribute('transform', 'translate(' + x + ' ' + y + ')');
      s.style.transformBox = 'view-box'; s.style.transformOrigin = '0 0';
      svg.appendChild(s);
      const dist = rand(14, 44);
      s.animate([
        { transform: 'translate(' + x + 'px,' + y + 'px) rotate(0deg) scale(1)', opacity: 1 },
        { transform: 'translate(' + (x + Math.cos(a) * dist) + 'px,' + (y + Math.sin(a) * dist + 8) + 'px) rotate(' + rand(-200, 200) + 'deg) scale(.4)', opacity: 0 }
      ], { duration: rand(420, 720), easing: 'cubic-bezier(.1,.7,.3,1)', fill: 'forwards' });
    }
  }
}

/* ---------------------------------------------------------------------
   Glitch: out in ~0.3s, then smoothly back in
   --------------------------------------------------------------------- */
function glitchOutIn(el) {
  if (REDUCE) { el.animate([{ opacity: 1 }, { opacity: .4 }, { opacity: 1 }], { duration: 300 }); return; }
  const rgb = (p) => 'drop-shadow(' + (-p) + 'px 0 0 rgba(255,50,110,.85)) drop-shadow(' + p + 'px 0 0 rgba(40,220,255,.85))';
  const slice = () => 'inset(' + rand(0, 55).toFixed(0) + '% 0 ' + rand(0, 55).toFixed(0) + '% 0)';
  const frame = (offset, op, s, easing) => ({
    offset, opacity: op,
    translate: (rand(-1, 1) * 14 * s).toFixed(1) + 'px ' + (rand(-1, 1) * 2 * s).toFixed(1) + 'px',
    clipPath: s ? slice() : 'inset(0% 0% 0% 0%)',
    filter: s ? rgb(5 * s) : 'none',
    easing: easing || 'steps(1, end)'
  });
  const out = el.animate([
    frame(0, 1, 0), frame(.16, .9, 1), frame(.32, .55, 1.3), frame(.5, .8, 1), frame(.68, .3, 1.4), frame(.84, .12, 1), frame(1, .05, 0)
  ], { duration: 320, fill: 'forwards' });
  out.onfinish = () => {
    const back = el.animate([
      frame(0, .05, 1.4), frame(.12, .85, 1.5), frame(.22, .15, 1.2), frame(.36, .9, 1), frame(.5, .55, .8),
      frame(.66, 1, .5, 'ease-out'), frame(.82, 1, .2, 'ease-out'), frame(1, 1, 0, 'ease-out')
    ], { duration: 720, fill: 'forwards' });
    back.onfinish = () => { back.cancel(); out.cancel(); };
  };
}

function initLinks() {
  let busy = false;
  const open = (url) => {
    if (CUSTOMIZE.openInNewTab) {
      const w = window.open(url, '_blank');
      if (w) { try { w.opener = null; } catch (e) {} } else { location.href = url; }   // popup blocked → same tab
    } else { location.href = url; }
  };
  document.querySelectorAll('[data-crack]').forEach((a) => {
    a.addEventListener('click', (e) => {
      if (e.defaultPrevented || e.button > 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;   // let "open in new tab" shortcuts through
      e.preventDefault();
      if (busy) return;
      busy = true;
      const r = a.getBoundingClientRect();
      // keyboard activation reports 0,0 → use the card's centre instead
      const x = e.clientX || (r.left + r.width / 2), y = e.clientY || (r.top + r.height / 2);
      crackAt(x, y);
      glitchOutIn(a);
      setTimeout(() => open(a.href), REDUCE ? 250 : NAV_DELAY);
      setTimeout(() => { busy = false; }, 1200);
    });
  });
}

/* ---------------------------------------------------------------------
   Music: autoplay attempt → first-gesture unlock → play / pause pill
   --------------------------------------------------------------------- */
const audio = $('#bg-music'), player = $('#player'), pStatus = $('#p-status');
let userPaused = false, hasPlayed = false, missing = false, unlockBusy = false;

function renderPlayer() {
  let label;
  if (missing)             label = 'add your audio file';
  else if (!audio.paused)  label = 'now playing';
  else if (hasPlayed)      label = 'paused';
  else                     label = 'tap anywhere to play';
  player.classList.toggle('is-playing', !audio.paused);
  player.setAttribute('aria-pressed', String(!audio.paused));
  pStatus.textContent = label;
}

function tryPlay() {
  if (missing || userPaused) return Promise.resolve(false);
  let p;
  try { p = audio.play(); } catch (e) { return Promise.resolve(false); }
  if (!p || !p.then) return Promise.resolve(!audio.paused);
  return p.then(() => { hasPlayed = true; renderPlayer(); return true; })
          .catch((err) => { if (err && err.name === 'NotSupportedError') missing = true; renderPlayer(); return false; });
}

function initMusic() {
  if (CUSTOMIZE.audioSrc) audio.src = CUSTOMIZE.audioSrc;            // the browser percent-encodes spaces for us
  audio.volume = clamp(Number(CUSTOMIZE.volume), 0, 1);
  audio.addEventListener('play', renderPlayer);
  audio.addEventListener('pause', renderPlayer);
  audio.addEventListener('error', () => { if (audio.error && audio.error.code === 4) { missing = true; renderPlayer(); } });
  if (!CUSTOMIZE.audioSrc) missing = true;

  player.addEventListener('click', () => {
    Birds.unlock();
    if (audio.paused) { userPaused = false; tryPlay(); }
    else { userPaused = true; audio.pause(); }
  });

  // browsers block autoplay until a gesture: keep listening until the music is really playing
  const EVENTS = ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'];
  const onGesture = (e) => {
    if (e.target && e.target.closest && e.target.closest('#player, #birds')) return;   // those buttons handle themselves
    if (unlockBusy) return;
    unlockBusy = true;
    Birds.unlock();
    const go = (!userPaused && !missing && audio.paused) ? tryPlay() : Promise.resolve(true);
    go.then(() => {
      unlockBusy = false;
      const musicDone = !audio.paused || missing || userPaused;
      if (musicDone && Birds.isReady()) EVENTS.forEach((t) => window.removeEventListener(t, onGesture, true));
    });
  };
  EVENTS.forEach((t) => window.addEventListener(t, onGesture, { capture: true, passive: true }));

  renderPlayer();
  tryPlay();                                                          // may be refused until the first gesture
}

/* ---------------------------------------------------------------------
   Birdsong — synthesized, soft, never the same twice
   Sine "voices" with quick pitch glides, a little FM warble, a faint 2nd harmonic,
   random pan + distance (far birds are duller and wetter), long reverb tail, and
   natural pauses between phrases (sometimes a distant reply).
   --------------------------------------------------------------------- */
const Birds = (() => {
  const btn = $('#birds');
  let ctx = null, master = null, conv = null, timer = 0, last = '';
  let enabled = CUSTOMIZE.birdsong !== false;
  try { if (localStorage.getItem('lakeBirdsOff') === '1') enabled = false; } catch (e) {}
  const vol = clamp(Number(CUSTOMIZE.birdVolume), 0, 1);

  function render() {
    btn.setAttribute('aria-pressed', String(enabled));
    btn.setAttribute('aria-label', enabled ? 'Birdsong on' : 'Birdsong off');
    btn.classList.toggle('off', !enabled);
  }

  function build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { return false; }
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    conv = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 2.6), buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    conv.buffer = buf;
    const wetOut = ctx.createGain(); wetOut.gain.value = .85;
    conv.connect(wetOut); wetOut.connect(master);
    return true;
  }

  /* one soft note: pitch glide f0 → (mid) → f1 over `dur` seconds */
  function note(t, f0, f1, dur, o) {
    o = o || {};
    const far = o.far || 0, amp = (o.amp || .14) * (1 - far * .6);
    const osc = ctx.createOscillator(); osc.type = 'sine';
    osc.frequency.setValueAtTime(f0, t);
    if (o.mid) osc.frequency.exponentialRampToValueAtTime(o.mid, t + dur * .5);
    osc.frequency.exponentialRampToValueAtTime(f1, t + dur);

    const o2 = ctx.createOscillator(); o2.type = 'sine';                      // faint octave for a brighter, more organic tone
    o2.frequency.setValueAtTime(f0 * 2, t);
    if (o.mid) o2.frequency.exponentialRampToValueAtTime(o.mid * 2, t + dur * .5);
    o2.frequency.exponentialRampToValueAtTime(f1 * 2, t + dur);
    const g2 = ctx.createGain(); g2.gain.value = .13;

    let fm = null;
    if (o.fm) {                                                                // warble: frequency modulation
      fm = ctx.createOscillator(); fm.frequency.value = o.fm;
      const mg = ctx.createGain(); mg.gain.value = o.fmDepth || 60;
      fm.connect(mg); mg.connect(osc.frequency); fm.start(t); fm.stop(t + dur + .05);
    }

    const env = ctx.createGain();
    env.gain.setValueAtTime(.0001, t);
    env.gain.exponentialRampToValueAtTime(amp, t + Math.min(.022, dur * .3));
    env.gain.exponentialRampToValueAtTime(.0001, t + dur);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7600 - far * 4600;

    osc.connect(env); o2.connect(g2); g2.connect(env); env.connect(lp);
    let out = lp;
    if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = clamp(o.pan || 0, -1, 1); lp.connect(p); out = p; }
    const dry = ctx.createGain(); dry.gain.value = 1 - far * .5; out.connect(dry); dry.connect(master);
    const wet = ctx.createGain(); wet.gain.value = .42 + far * .6; out.connect(wet); wet.connect(conv);

    osc.start(t); o2.start(t); osc.stop(t + dur + .06); o2.stop(t + dur + .06);
  }

  const PHRASES = {
    trill(t, k, o) {                                   // quick, light trill
      const n = 6 + Math.floor(Math.random() * 7), f = rand(3300, 4200) * k, step = rand(.05, .068), dir = Math.random() < .5 ? 1 : -1;
      for (let i = 0; i < n; i++) note(t + i * step, f * (1 + dir * i * .012), f * (.9 + dir * i * .008), .042, Object.assign({ amp: .1 }, o));
    },
    tweet(t, k, o) {                                   // "tsee-tsu"
      note(t, 2300 * k, 3500 * k, .17, Object.assign({ amp: .15, mid: 2900 * k }, o));
      note(t + .27, 3400 * k, 2500 * k, .2, Object.assign({ amp: .13 }, o));
      if (Math.random() < .6) note(t + .6, 2600 * k, 3300 * k, .13, Object.assign({ amp: .11 }, o));
    },
    whistle(t, k, o) {                                 // slow, round, a touch of vibrato
      note(t, 1800 * k, 2700 * k, .4, Object.assign({ amp: .15, fm: 6, fmDepth: 28 }, o));
      note(t + .58, 2650 * k, 1900 * k, .48, Object.assign({ amp: .14, fm: 5.4, fmDepth: 32 }, o));
    },
    warble(t, k, o) {                                  // running song of mixed notes
      let tt = t;
      const n = 5 + Math.floor(Math.random() * 4);
      for (let i = 0; i < n; i++) {
        const f = rand(2500, 4100) * k, d = rand(.07, .13);
        note(tt, f, f * rand(.8, 1.25), d, Object.assign({ amp: .11, fm: rand(35, 70), fmDepth: rand(90, 210) }, o));
        tt += d + rand(.02, .06);
      }
    },
    dawn(t, k, o) {                                    // "chi-chi-chuu"
      [[4100, 3500, .07, 0], [3800, 3200, .07, .12], [3000, 2200, .15, .25]].forEach((n) =>
        note(t + n[3], n[0] * k, n[1] * k, n[2], Object.assign({ amp: .12 }, o)));
    },
    owl(t, k, o) {                                     // very soft, far away
      const q = Object.assign({}, o, { far: Math.max(.8, o.far || 0), amp: .2 });
      note(t, 430 * k, 360 * k, .46, q);
      note(t + .7, 420 * k, 345 * k, .52, q);
    }
  };
  const BAG = ['trill', 'tweet', 'tweet', 'whistle', 'warble', 'dawn', 'dawn', 'owl'];

  function choose(not) {
    let n, guard = 0;
    do { n = BAG[Math.floor(Math.random() * BAG.length)]; } while ((n === last || n === not || (n === 'owl' && Math.random() < .6)) && ++guard < 8);
    return n;
  }

  function tick() {
    timer = 0;
    if (!enabled || !ctx) return;
    if (!document.hidden && ctx.state === 'running') {
      const name = choose(), t = ctx.currentTime + .06, pan = rand(-.75, .75);
      PHRASES[name](t, rand(.92, 1.08), { pan, far: Math.random() < .4 ? rand(.4, .9) : rand(0, .3) });
      last = name;
      if (Math.random() < .3) {                       // a distant answer
        const other = choose(name);
        PHRASES[other](t + rand(1.1, 2), rand(.9, 1.1), { pan: -pan * rand(.4, 1), far: rand(.6, .95) });
      }
    }
    timer = setTimeout(tick, rand(2600, 8200) + (Math.random() < .18 ? rand(4000, 8000) : 0));   // natural pauses
  }

  function start() {
    if (!ctx || !enabled) return;
    master.gain.setTargetAtTime(vol, ctx.currentTime, .9);             // slow fade-in
    if (!timer) timer = setTimeout(tick, 1100);
  }

  function unlock() {                                                  // call from a user gesture
    if (!enabled) return;
    if (!ctx && !build()) return;
    if (ctx.state !== 'running') { const p = ctx.resume(); if (p && p.catch) p.catch(() => {}); }
    start();
  }

  function toggle() {
    enabled = !enabled;
    try { localStorage.setItem('lakeBirdsOff', enabled ? '0' : '1'); } catch (e) {}
    render();
    if (enabled) unlock();
    else {
      clearTimeout(timer); timer = 0;
      if (ctx) master.gain.setTargetAtTime(0, ctx.currentTime, .25);
    }
  }

  btn.addEventListener('click', toggle);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && enabled && ctx && ctx.state !== 'running') { const p = ctx.resume(); if (p && p.catch) p.catch(() => {}); }
  });
  render();
  return { unlock, isReady: () => !enabled || (!!ctx && ctx.state === 'running') };
})();

/* ---------------------------------------------------------------------
   boot
   --------------------------------------------------------------------- */
applyConfig();
initLinks();
initMusic();

})();
</script>
</body>
